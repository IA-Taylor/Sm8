AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ServiceM8 -> Zunos -> EPAN automated part-order workflow

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 1536
    Timeout: 60
    Tracing: Active

Parameters:
  SsmPrefix:
    Type: String
    Default: /sm8-part-bot

Resources:
  PendingOrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sm8-part-bot-pending-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_uuid
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: job_uuid
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sm8-part-bot
      CodeUri: ../
      Handler: dist/handler.handler
      Environment:
        Variables:
          SSM_PREFIX: !Ref SsmPrefix
          PENDING_ORDERS_TABLE: !Ref PendingOrdersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PendingOrdersTable
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameters
                - ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            Path: /sm8/webhook
            Method: POST

Outputs:
  WebhookUrl:
    Description: URL to register as the ServiceM8 webhook target
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/sm8/webhook
  TableName:
    Value: !Ref PendingOrdersTable
